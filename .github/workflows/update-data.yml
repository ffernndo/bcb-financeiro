name: Update BCB data

on:
  schedule:
    - cron: '0 12 5 * *'    # Day 5 of every month, 09:00 BRT
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Collect credit series (SGS)
        working-directory: scripts
        run: python fetch_credito.py
        continue-on-error: true

      - name: Collect interest rates
        working-directory: scripts
        run: python fetch_taxas.py
        continue-on-error: true

      - name: Collect IF.data (financial statements)
        working-directory: scripts
        run: python fetch_ifdata.py
        continue-on-error: true

      - name: Collect geographic data
        working-directory: scripts
        run: python fetch_estban.py
        continue-on-error: true

      - name: Collect complaints ranking
        working-directory: scripts
        run: python fetch_reclamacoes.py
        continue-on-error: true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: update data $(date +%Y-%m)"
          git push
